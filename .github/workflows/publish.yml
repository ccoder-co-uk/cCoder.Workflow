# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_DISABLE_PERSISTENT_MSBUILD_SERVER: true
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/nuget

defaults:
  run:
    shell: pwsh

jobs:
  build-test-pack:
    runs-on: [self-hosted, Windows, X64, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create version number
        id: version
        run: |
          "value=$(Get-Date -Format 'yyyy.M.d.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/cCoder.Workflow.slnx

      - name: Build
        run: ./.github/scripts/Build-Projects.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Test with coverage
        run: ./.github/scripts/Run-Tests.ps1 -CollectCoverage

      - name: Enforce services and exposures coverage
        run: |
          $coverageFiles = @(
            Get-ChildItem artifacts/test-results -Recurse -Filter coverage.cobertura.xml
          )

          if ($coverageFiles.Count -eq 0) {
            throw 'No Cobertura coverage reports were produced.'
          }

          $lines = @{}

          foreach ($coverageFile in $coverageFiles) {
            [xml] $coverage = Get-Content -LiteralPath $coverageFile.FullName

            foreach ($class in $coverage.coverage.packages.package.classes.class) {
              $sourceFile = [string] $class.filename

              if ($sourceFile -notmatch '(^|[/\\])(Services|Exposures)[/\\]') {
                continue
              }

              foreach ($line in $class.lines.line) {
                $key = "$sourceFile|$($line.number)"

                if (-not $lines.ContainsKey($key)) {
                  $lines[$key] = 0
                }

                if ([int] $line.hits -gt 0) {
                  $lines[$key] = 1
                }
              }
            }
          }

          if ($lines.Count -eq 0) {
            throw 'No service or exposure source lines were found in the coverage reports.'
          }

          $coveredLines = @($lines.Values | Where-Object { $_ -eq 1 }).Count
          $lineRate = $coveredLines / $lines.Count
          $percentage = $lineRate.ToString('P3')

          "Services and exposures line coverage: $coveredLines/$($lines.Count) ($percentage)" |
            Write-Output

          if ($lineRate -le 0.95) {
            throw "Services and exposures line coverage must be greater than 95%; actual: $percentage."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/test-results

      - name: Pack
        run: |
          New-Item -ItemType Directory -Path "${{ env.NUGET_DIRECTORY }}" -Force | Out-Null
          dotnet pack src/cCoder.Workflow.Activities/cCoder.Workflow.Activities.csproj -c Release --no-build --no-restore --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"
          dotnet pack src/cCoder.Workflow.Engine/cCoder.Workflow.Engine.csproj -c Release --no-build --no-restore --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"
          dotnet pack src/cCoder.Workflow/cCoder.Workflow.csproj -c Release --no-build --no-restore --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NUGET_DIRECTORY }}/*.nupkg
            !${{ env.NUGET_DIRECTORY }}/*.snupkg

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Filter *.nupkg)) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  coverage-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-${{ github.sha }}
          path: test-results

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install ReportGenerator
        run: dotnet tool install --tool-path tools dotnet-reportgenerator-globaltool --version 5.5.10

      - name: Generate coverage report
        run: |
          tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          touch coverage-report/.nojekyll

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-report

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v4
